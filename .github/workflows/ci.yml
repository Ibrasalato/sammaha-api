name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Sammha_dev_2026!"
        ports: ["1433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Sammha_dev_2026!' -Q 'SELECT 1' || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Sammha.slnx
      - name: Vulnerable packages
        run: |
          dotnet list Sammha.slnx package --vulnerable --include-transitive | tee vuln.txt
          if grep -q "has the following vulnerable packages" vuln.txt; then grep -E "^\s+>" vuln.txt | sort -u | while read -r l; do echo "::error::vulnerable: $l"; done; exit 1; fi
      - run: dotnet build Sammha.slnx -c Release --no-restore
      - name: Test (real SQL Server)
        run: dotnet test Sammha.slnx -c Release --no-build --blame-hang-timeout 4m --logger "console;verbosity=normal" --logger GitHubActions
        env:
          SAMMHA_TEST_DB: "Server=localhost,1433;User Id=sa;Password=Sammha_dev_2026!;TrustServerCertificate=True"
      - name: Report hung tests
        if: failure()
        run: |
          for f in $(find . -name 'Sequence_*.xml'); do
            echo "::error title=Tests running at hang::$(grep -o 'Name="[^"]*"' "$f" | tail -5 | tr '\n' ' ')"
          done
      - name: Publish for IIS
        if: github.ref == 'refs/heads/main'
        run: dotnet publish src/Sammha.Api/Sammha.Api.csproj -c Release -o publish
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: sammha-api-iis
          path: publish
          retention-days: 30
